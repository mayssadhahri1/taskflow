# PostgreSQL avec stockage persistant (StatefulSet + volume)
apiVersion: v1
kind: Service
metadata:
  name: taskflow-db
  labels:
    app.kubernetes.io/name: taskflow-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: taskflow-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskflow-db
  labels:
    app.kubernetes.io/name: taskflow-db
spec:
  serviceName: taskflow-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskflow
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d taskflow"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
