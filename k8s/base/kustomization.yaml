apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ressources communes à tous les environnements (dev, prod)
resources:
  - configmap.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: taskflow
    includeSelectors: false
